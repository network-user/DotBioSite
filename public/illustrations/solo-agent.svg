    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#f3f3f1">
      <text x="646" y="292" fill-opacity="0.28">1</text>
      <text x="666" y="292" fill-opacity="0.55">async def claim_job():</text>
      <text x="646" y="314" fill-opacity="0.22">2</text>
      <text x="666" y="314" fill-opacity="0.4">    job = await queue.pull()</text>
      <text x="646" y="336" fill-opacity="0.22">3</text>
      <text x="666" y="336" fill-opacity="0.45">    await hmac.verify(job)</text>
      <text x="646" y="358" fill-opacity="0.22">4</text>
      <text x="666" y="358" fill-opacity="0.35">    return worker.run(job)</text>
      <text x="646" y="380" fill-opacity="0.18">5</text>
      <rect x="666" y="392" width="8" height="14" fill="#f3f3f1" fill-opacity="0.55"/>
    </g>

