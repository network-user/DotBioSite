    <text x="983" y="322" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" fill="#f3f3f1" fill-opacity="0.55">draft endpoint</text>
    <text x="983" y="336" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" fill="#f3f3f1" fill-opacity="0.35">+ tests</text>

    <rect x="914" y="354" width="138" height="36" rx="6" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
    <text x="983" y="370" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" fill="#f3f3f1" fill-opacity="0.5">review diff</text>
    <text x="983" y="384" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" fill="#f3f3f1" fill-opacity="0.3">ship PR</text>

    <circle cx="983" cy="450" r="10" fill="none" stroke="#f3f3f1" stroke-opacity="0.45" stroke-width="1.5"/>
    <circle cx="983" cy="450" r="4" fill="#f3f3f1" fill-opacity="0.7"/>
    <circle cx="983" cy="450" r="16" fill="none" stroke="#f3f3f1" stroke-opacity="0.15" stroke-width="1"/>
