  <text x="800" y="800" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" fill="#a6a7ab">один человек · роли вокруг · агент в IDE</text>
  <text x="800" y="840" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#5a5c63">.ядро</text>
