    </g>
    <g opacity="0.36">
      <rect x="1280" y="400" width="100" height="40" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5"/>
      <text x="1330" y="426" fill="#f3f3f1">QA</text>
    </g>
    <g opacity="0.38">
      <rect x="710" y="100" width="140" height="40" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.32" stroke-width="1.5"/>
      <text x="780" y="126" fill="#f3f3f1">product</text>
    </g>
